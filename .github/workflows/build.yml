name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bushra-AI-Agent-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # ফোন থেকে সরাসরি নামানোর জন্য: Releases পেজে সবসময় সর্বশেষ APK থাকবে
      - name: Publish latest APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Bushra AI Agent (latest build)
          body: সর্বশেষ বিল্ড। app-debug.apk নামিয়ে ফোনে ইনস্টল করুন।
          files: app/build/outputs/apk/debug/app-debug.apk
